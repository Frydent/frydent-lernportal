<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>frydent – Praxisurlaub Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',Arial,sans-serif;background:#f0f0f0;color:#1a1a1a;font-size:14px}
header{background:#fff;border-bottom:2px solid #1e3a6b;height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hbrand{display:flex;align-items:center;gap:10px}
.layout{display:flex;gap:24px;max-width:1100px;margin:22px auto 40px;padding:0 24px;align-items:flex-start}
.sidebar{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.main{flex:1}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#1e3a6b;margin-bottom:14px;font-family:'Quicksand',sans-serif}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.tbtn{padding:10px;border-radius:9px;border:2px solid #e5e5e5;background:#fff;cursor:pointer;font-size:13px;text-align:center;font-family:'Lato',sans-serif;transition:all .15s;line-height:1.3}
.tbtn:hover{border-color:#1e3a6b;color:#1e3a6b}
.tbtn.aktiv{border-color:#1e3a6b;background:#1e3a6b;color:#fff;font-weight:700}
.fg{margin-bottom:12px}
.fg label{font-size:12px;color:#666;display:block;margin-bottom:3px;font-family:'Quicksand',sans-serif;font-weight:600}
.fg input,.fg textarea{width:100%;padding:8px 11px;border-radius:7px;border:1.5px solid #ddd;font-size:14px;font-family:'Lato',sans-serif;outline:none;background:#fafffe}
.fg input:focus,.fg textarea:focus{border-color:#1e3a6b}
.fg textarea{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-print{width:100%;margin-top:4px;padding:12px 0;border-radius:9px;border:none;background:#1e3a6b;color:#fff;font-size:14px;font-weight:700;font-family:'Quicksand',sans-serif;cursor:pointer;letter-spacing:.03em}
.btn-print:hover{opacity:.88}
.btn-reset{width:100%;margin-top:7px;padding:8px 0;border-radius:9px;border:1.5px solid #ddd;background:#fff;color:#999;font-size:13px;font-family:'Lato',sans-serif;cursor:pointer}
.btn-reset:hover{border-color:#1e3a6b;color:#1e3a6b}
.preview-panel{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.phdr{background:#fff;border-bottom:2px solid #1e3a6b;padding:12px 28px;display:flex;align-items:center;justify-content:space-between}
.pbody{background:#fff}
.pfuss{border-top:2px solid #1e3a6b;padding:9px 0;font-size:11px;color:#666;text-align:center;background:#f8fafd;font-family:'Lato',sans-serif}

/* ── DOKUMENT-ELEMENTE ── */
.doc-intro{font-family:'Lato',sans-serif;font-size:15px;line-height:1.6;margin-bottom:10px}
.doc-typ{font-family:'Quicksand',sans-serif;font-size:24px;font-weight:800;color:#1e3a6b;margin-bottom:6px}

/* 2. Blaue Box — größer, dominanter */
.doc-dates-box{
  background:#dce8f7;
  border:2.5px solid #1e3a6b;
  border-radius:10px;
  padding:14px 24px;
  text-align:center;
  margin:10px 0;
  box-shadow:0 2px 8px rgba(30,58,107,.12);
}
.doc-dates-label{
  font-size:12px;text-transform:uppercase;letter-spacing:.15em;
  color:#1e3a6b;font-weight:700;margin-bottom:6px;
  font-family:'Quicksand',sans-serif;
}
.doc-dates-val{
  font-size:20px;font-weight:800;color:#1e3a6b;line-height:1.7;
  font-family:'Quicksand',sans-serif;
}

/* 4. Grüne Box — etwas größer, leicht grün */
.doc-reopen{
  background:#e8f7f3;
  border:2px solid #27ae60;
  border-radius:9px;
  padding:12px 18px;
  text-align:center;
  margin:12px 0;
  font-family:'Quicksand',sans-serif;
  font-size:15px;
  color:#1a5c3a;
  font-weight:600;
  box-shadow:0 2px 8px rgba(39,174,96,.12);
}
.doc-reopen strong{color:#1e7d46;font-size:16px}

/* 5. Notfall-Block — in Rahmen, einheitlich, keine Emojis */
.doc-notfall{
  border:2px solid #c0392b;
  border-radius:9px;
  padding:14px 18px;
  margin:12px 0;
  background:#fffafa;
  box-shadow:0 2px 8px rgba(192,57,43,.1);
}
.ntitle{
  color:#c0392b;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
  margin-bottom:12px;
  font-family:'Quicksand',sans-serif;
  border-bottom:1px solid #f5c6c2;
  padding-bottom:8px;
}
.nrow{
  display:flex;align-items:flex-start;gap:0;
  margin-bottom:10px;font-size:13px;line-height:1.55;
  font-family:'Lato',sans-serif;
}
.nrow:last-child{margin-bottom:0}
.nlabel{
  font-weight:700;color:#1e3a6b;
  width:210px;min-width:210px;flex-shrink:0;
  font-size:12px;font-family:'Quicksand',sans-serif;
  padding-top:3px;
}
.nnum{font-size:16px;font-weight:800;color:#c0392b;display:block;font-family:'Quicksand',sans-serif;letter-spacing:.02em}
.nsub{font-size:11px;color:#aaa;display:block;margin-top:1px}

/* Vertretung — auch in Rahmen, einheitlich */
.doc-vert{
  border:2px solid #1e3a6b;
  border-radius:9px;
  padding:14px 20px;
  margin:18px 0;
  background:#f4f7ff;
}
.vtitle{
  color:#1e3a6b;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:8px;font-family:'Quicksand',sans-serif;
  border-bottom:1px solid #c8d5f0;padding-bottom:8px;
}


/* QR-Code Footer */
.doc-qr-footer{
  margin-top:6px;
  padding:12px 14px;
  border:1px solid #d0d8e8;
  border-radius:9px;
  background:#f8fafd;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:0 2px 8px rgba(30,58,107,.08);
}
.doc-qr-footer img{height:25mm;width:25mm}
.doc-qr-text{font-size:13px;color:#666;line-height:1.6;font-family:'Lato',sans-serif}
.doc-qr-text a{color:#1e3a6b;text-decoration:none;font-weight:600}

/* Multi-Vertretung */
.vert-entry{background:#f8fafd;border:1.5px solid #e0e6f0;border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative}
.vert-entry .vert-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.vert-entry .vert-head input[type=text]{flex:1}
.vert-select{flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid #ddd;font-size:13px;font-family:'Lato',sans-serif;outline:none;background:#fff;cursor:pointer;color:#1a1a1a}
.vert-select:focus{border-color:#1e3a6b}
.vert-remove{width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:#fff;color:#c0392b;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Lato',sans-serif;line-height:1;padding:0}
.vert-remove:hover{background:#fdecea;border-color:#c0392b}
.vert-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vert-dates label{font-size:11px;color:#999;font-family:'Quicksand',sans-serif;font-weight:600}
.vert-dates input{width:100%;padding:5px 8px;border-radius:6px;border:1.5px solid #ddd;font-size:13px;font-family:'Lato',sans-serif;outline:none;background:#fff}
.vert-dates input:focus{border-color:#1e3a6b}
.btn-add-vert{width:100%;padding:9px 0;border-radius:8px;border:1.5px dashed #1e3a6b;background:transparent;color:#1e3a6b;font-size:13px;font-weight:600;font-family:'Quicksand',sans-serif;cursor:pointer;letter-spacing:.02em}
.btn-add-vert:hover{background:#f0f4ff}
.vert-nr{font-size:10px;color:#999;font-weight:700;font-family:'Quicksand',sans-serif;margin-right:4px}

@media print{
  header,.sidebar,.phdr{display:none!important}
  body{background:#fff}
  .layout{display:block;margin:0;padding:0;max-width:100%}
  .preview-panel{box-shadow:none;border-radius:0}
  .main{width:100%}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<header>
  <div class="hbrand">
    <img id="hdr_logo" style="height:26px" alt="FRYDENT"/>
    <span style="color:#1e3a6b;opacity:.4;font-size:20px;margin:0 6px">|</span>
    <span style="font-size:15px;color:#1e3a6b;font-weight:700;font-family:'Quicksand',sans-serif">Praxisurlaub Generator</span>
  </div>
  <span style="font-size:12px;color:#999;font-family:'Lato',sans-serif">Martinstraße 21 · Bonndorf im Schwarzwald</span>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="card">
      <div class="card-title">Art der Schließung</div>
      <div class="type-grid">
        <button class="tbtn aktiv" onclick="setTyp(this,'🏖️','Praxisurlaub','Urlaub')">🏖️ Urlaub</button>
        <button class="tbtn" onclick="setTyp(this,'🎉','Feiertag','Feiertag')">🎉 Feiertag</button>
        <button class="tbtn" onclick="setTyp(this,'🏥','Krankheit','Erkrankung')">🏥 Krankheit</button>
        <button class="tbtn" onclick="setTyp(this,'🔧','Umbau','Umbaumaßnahmen')">🔧 Umbau</button>
        <button class="tbtn" onclick="setTyp(this,'📅','Fortbildung','Fortbildung')">📅 Fortbildung</button>
        <button class="tbtn" onclick="setTyp(this,'⚡','Notfall','Notfall')">⚡ Notfall</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Schließungszeitraum</div>
      <div class="row2">
        <div class="fg"><label>Von</label><input type="date" id="vonDate" oninput="update()"/></div>
        <div class="fg"><label>Bis (einschl.)</label><input type="date" id="bisDate" oninput="update()"/></div>
      </div>
      <div class="fg"><label>Wieder ab</label><input type="date" id="reopenDate" oninput="update()"/></div>
    </div>
    <div class="card">
      <div class="card-title">Vertretung (optional)</div>
      <div id="vertList"></div>
      <button class="btn-add-vert" onclick="addVert()">+ Vertretung hinzufügen</button>
    </div>
    <div class="card">
      <button class="btn-print" onclick="window.print()">🖨 Drucken / Als PDF</button>
      <button class="btn-reset" onclick="resetAll()">↺ Zurücksetzen</button>
    </div>
  </div>
  <div class="main">
    <div class="preview-panel">
      <div class="phdr">
        <img id="prev_logo" style="height:24px" alt="frydent"/>
        <span style="font-size:11px;color:#aaa;font-style:italic;font-family:'Lato',sans-serif" id="previewLabel">Vorschau · Praxisurlaub</span>
      </div>
      <div class="pbody">
        <!-- Logo only, NO Briefkopf-Adressblock -->
        <div style="padding:12mm 22mm 0 25mm;display:flex;align-items:center;justify-content:space-between">
          <img id="brief_logo" style="height:14mm;display:block" alt="frydent"/>
          <img id="easter_img" style="height:22mm;display:none" alt=""/>
        </div>
        <!-- 1. Großer Abstand unter Logo (~1,5–2cm) -->
        <div style="padding:18mm 22mm 20mm 25mm" id="docMain"></div>
      </div>
      <div class="pfuss" id="docFuss"></div>
    </div>
  </div>
</div>

  Feiertag:"Wir wünschen Ihnen ein schönes Fest und freuen uns, Sie danach wieder in unserer Praxis begrüßen zu dürfen.",
  Erkrankung:"Wir bitten um Ihr Verständnis. Für dringende Anliegen steht Ihnen bitte der zahnärztliche Notfalldienst zur Verfügung.",
  Umbaumaßnahmen:"Wir arbeiten an der Renovierung und freuen uns, Sie bald in unserer frisch gestalteten Praxis begrüßen zu dürfen. Vielen Dank für Ihr Verständnis!",
  Fortbildung:"Um Ihnen die bestmögliche Behandlung bieten zu können, nehmen wir an einer Fortbildung teil. Vielen Dank für Ihr Verständnis.",
  Notfall:"Aufgrund eines unvorhergesehenen Ereignisses ist unsere Praxis vorübergehend geschlossen. Wir bitten um Ihr Verständnis."
};

function setTyp(btn,icon,label,key){
  document.querySelectorAll(".tbtn").forEach(function(b){b.classList.remove("aktiv")});
  btn.classList.add("aktiv");
  cur={icon:icon,label:label,key:key};
  document.getElementById("previewLabel").textContent="Vorschau · "+label;
  update();
}

function fmtLong(str){
  if(!str)return null;
  return new Date(str+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

function fmtShort(str){
  if(!str)return null;
  return new Date(str+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long"});
}

var PRAXEN=[
  {name:"Zahnarztpraxis Tisch-Rottensteiner",adr:"Schulstraße 2, 79853 Lenzkirch",tel:"+49 7653 961601"},
  {name:"Zahnarztpraxis Mikael Ebbesen",adr:"Hauptstraße 33, 79780 Stühlingen",tel:"+49 7744 1007"},
  {name:"Zahnarztpraxis Dr. Kaiser",adr:"Todtmooserstraße 5, 79837 St. Blasien",tel:"+49 7672 1555"},
  {name:"Zahnarztpraxis Dr. Gudrun Holm",adr:"Paulinerstraße 5, 79848 Bonndorf im Schwarzwald",tel:"+49 7703 1616"},
  {name:"Zahnheilkunde am Schluchsee – Dr. Heinrichsbauer",adr:"Fischbacher Straße 11, 79859 Schluchsee",tel:"+49 7656 1628"}
];
function praxenOptions(){
  var opts='<option value="">– Praxis auswählen –</option>';
  for(var i=0;i<PRAXEN.length;i++){
    opts+='<option value="'+i+'">'+PRAXEN[i].name+'</option>';
  }
  return opts;
}
var vertCount=0;
function addVert(){
  vertCount++;
  var id=vertCount;
  var div=document.createElement("div");
  div.className="vert-entry";
  div.id="vert_"+id;
  div.innerHTML='<div class="vert-head">'
    +'<span class="vert-nr">'+id+'</span>'
    +'<select class="vert-select" onchange="onVertSelect(this);update()">'
    +praxenOptions()
    +'</select>'
    +'<button class="vert-remove" onclick="removeVert('+id+')" title="Entfernen">✕</button>'
    +'</div>'
    +'<div class="vert-detail" style="display:none;font-size:12px;color:#666;font-family:Lato,sans-serif;margin:4px 0 6px 24px;line-height:1.5"></div>'
    +'<div class="vert-dates">'
    +'<div><label>Von</label><input type="date" oninput="update()"/></div>'
    +'<div><label>Bis</label><input type="date" oninput="update()"/></div>'
    +'</div>';
  document.getElementById("vertList").appendChild(div);
  update();
}
function onVertSelect(sel){
  var entry=sel.closest(".vert-entry");
  var detail=entry.querySelector(".vert-detail");
  var idx=sel.value;
  if(idx===""){detail.style.display="none";detail.innerHTML="";return;}
  var p=PRAXEN[parseInt(idx)];
  detail.style.display="block";
  detail.innerHTML=p.adr+' · Tel. '+p.tel;
}

function removeVert(id){
  var el=document.getElementById("vert_"+id);
  if(el)el.remove();
  renumberVerts();
  update();
}

function renumberVerts(){
  var entries=document.querySelectorAll("#vertList .vert-entry");
  entries.forEach(function(e,i){
    var nr=e.querySelector(".vert-nr");
    if(nr)nr.textContent=(i+1);
  });
}

function getVertretungen(){
  var list=[];
  var entries=document.querySelectorAll("#vertList .vert-entry");
  entries.forEach(function(e){
    var sel=e.querySelector(".vert-select");
    var inputs=e.querySelectorAll("input[type=date]");
    var idx=sel.value;
    if(idx==="")return;
    var p=PRAXEN[parseInt(idx)];
    var fullName=p.name+", "+p.adr+", Tel. "+p.tel;
    var von=inputs[0].value;
    var bis=inputs[1].value;
    list.push({name:p.name,adr:p.adr,tel:p.tel,fullName:fullName,von:von,bis:bis});
  });
  return list;
}

function notfallBlock(verts){
  var html='<div class="doc-notfall">';
  html+='<div class="ntitle">In dringenden Fällen während unserer Abwesenheit</div>';
  if(verts&&verts.length>0){
    for(var i=0;i<verts.length;i++){
      var v=verts[i];
      var dateStr="";
      if(v.von&&v.bis){
        dateStr='<br><span style="font-size:14px;color:#1e3a6b;font-weight:700;font-family:Quicksand,sans-serif">'+fmtShort(v.von)+' – '+fmtShort(v.bis)+'</span>';
      } else if(v.von){
        dateStr='<br><span style="font-size:14px;color:#1e3a6b;font-weight:700;font-family:Quicksand,sans-serif">ab '+fmtShort(v.von)+'</span>';
      }
      html+='<div class="nrow"><span class="nlabel">Vertretung'+(verts.length>1?' '+(i+1):'')+'</span>';
      html+='<span><span style="font-size:15px;font-weight:700;color:#1e3a6b;font-family:Quicksand,sans-serif">'+v.name+'</span>'+dateStr
        +'<br><span style="font-size:12px;color:#444;font-family:Lato,sans-serif">'+v.adr+' · Tel. '+v.tel+'</span></span></div>';
    }
  }
  html+='<div class="nrow"><span class="nlabel">Zahnärztlicher Notfalldienst</span>';
  html+='<span><span class="nnum">0761 – 120 120 00</span>';
  html+='</span></div>';
  html+='<div class="nrow"><span class="nlabel">Regionaler Bereitschaftsdienst</span>';
  html+='<span><span class="nnum">0180 3 – 222 555 45</span>';
  html+='</span></div>';
  html+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid #f5c6c2;font-size:12px;color:#666;font-family:Lato,sans-serif">Weitere Notfalldienste: <span style="font-weight:600;color:#1e3a6b">www.zahnaerzte-bw.de</span></div>';
  html+='</div>';
  return html;
}

function update(){
  var von=document.getElementById("vonDate").value;
  var bis=document.getElementById("bisDate").value;
  var reopen=document.getElementById("reopenDate").value;
  var verts=getVertretungen();
  var html="";

  // 1. Anrede mit Abstand
  html+='<p class="doc-intro">Sehr geehrte Patientinnen und Patienten,</p>';

  // Typ-Zeile
  html+='<p class="doc-typ">'+cur.label+'</p>';

  // 2. Blaue Box — groß, dominant
  var dv='<span style="opacity:.7;font-size:13px">Bitte Datum ausfüllen</span>';
  if(von&&bis){
    dv='<span style="opacity:.8;font-size:13px">vom</span><br><strong>'+fmtLong(von)+'</strong>'
      +'<br><span style="opacity:.8;font-size:13px">bis einschließlich</span><br><strong>'+fmtLong(bis)+'</strong>';
  } else if(von){
    dv='<strong>ab '+fmtLong(von)+'</strong>';
  }
  html+='<div class="doc-dates-box"><div class="doc-dates-label">Schließungszeitraum</div><div class="doc-dates-val">'+dv+'</div></div>';

  // 3. Fließtext mit Abstand
  html+='<p style="margin:10px 0 10px;line-height:1.6;font-size:15px;font-family:Lato,sans-serif">'+(bodyTexts[cur.key]||bodyTexts.Urlaub)+'</p>';

  // 4. Grüne Wiedereröffnungs-Box
  if(reopen){
    html+='<div class="doc-reopen">Ab <strong>'+fmtLong(reopen)+'</strong> wieder für Sie da!</div>';
  }

  // 5. Notfall-Block in Rahmen, kein Emoji
  html+=notfallBlock(verts);

  // Easter image in header
  document.getElementById('easter_img').style.display = (cur.key==='Feiertag') ? 'block' : 'none';

  // 5b. Feiertag-Hinweis: Detaillierte Notdienstliste online
  if(cur.key==='Feiertag'){
    html+='<div style="margin:4px 0;padding:10px 16px;background:#f0f7ff;border:1.5px solid #a8bee0;border-radius:8px;font-size:13px;color:#1e3a6b;line-height:1.6;font-family:Lato,sans-serif">';
    html+='<strong style="font-family:Quicksand,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.08em">Notdienstplan über die Feiertage</strong><br>';
    html+='Die vollständige Liste der diensthabenden Zahnarztpraxen mit Telefonnummern und Adressen finden Sie auf unserem Patientenportal <strong>info.frydent.de</strong> (QR-Code scannen) oder telefonisch über die oben genannten Notfallnummern.';
    html+='</div>';
  }

  // 6. QR-Code Footer (vor Signatur)
  html+='<div class="doc-qr-footer">';
  html+='<img src="data:image/png;base64,'+QRCODE+'" alt="QR-Code frydent.de"/>';
  html+='<div class="doc-qr-text">Aktuelle Praxisinformationen<br>finden Sie auf unserem Patientenportal:<br><a href="https://info.frydent.de" target="_blank">info.frydent.de</a></div>';
  html+='</div>';

  // 7. Kompakte Verabschiedung (ohne Rahmen)
  html+='<p style="margin:0;font-size:13px;color:#555;font-family:Lato,sans-serif;line-height:1.6;text-align:center">'
    +'Vielen Dank für Ihr Verständnis. · '
    +'<span style="font-weight:800;color:#1e3a6b;font-family:Quicksand,sans-serif;font-size:16px;letter-spacing:.03em">Ihr Team FRYDENT</span>'
    +' · <span style="font-size:12px;color:#888">Zahnarztpraxis Tatiana Frydrych</span></p>';

  document.getElementById("docMain").innerHTML=html;
}

function resetAll(){
  ["vonDate","bisDate","reopenDate"]
    .forEach(function(id){document.getElementById(id).value=""});
  document.getElementById("vertList").innerHTML="";
  vertCount=0;
  document.querySelectorAll(".tbtn").forEach(function(b,i){b.classList.toggle("aktiv",i===0)});
  cur={icon:"🏖️",label:"Praxisurlaub",key:"Urlaub"};
  document.getElementById("previewLabel").textContent="Vorschau · Praxisurlaub";
  update();
}
update();
</script>
</body>
</html>
