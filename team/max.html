<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Quicksand:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3D5A98;--blue-dark:#2C4170;--blue-darker:#1E2D4D;--gold:#E2C26A;--gold-dark:#C4A44E;--white:#FFFFFF;--gray-50:#F7F8FA;--gray-100:#F0F2F5;--gray-200:#E4E6EB;--gray-400:#B0B3B8;--gray-600:#6B7280;--gray-800:#1F2937}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6;min-height:100vh}

/* Header */
header{background:var(--white);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(30,45,77,.08)}
.header-inner{max-width:480px;margin:0 auto;padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between}
.logo-img{height:36px;width:auto}
.back-link{font-size:.78rem;font-weight:700;color:var(--blue-darker);text-decoration:none;display:flex;align-items:center;gap:6px;padding:8px 16px;transition:all .3s;letter-spacing:.3px}
.back-link:hover{color:var(--blue)}

/* Card container */
.card-wrapper{max-width:480px;margin:2.5rem auto;padding:0 1rem}
.card{background:var(--white);box-shadow:0 8px 32px rgba(30,45,77,.22);overflow:hidden}

/* Top section — dark with photo */
.card-top{background:linear-gradient(160deg,#4E6590 0%,#3F5580 35%,#2F4268 100%);padding:3.5rem 2rem 1.2rem;text-align:center;box-shadow:0 3px 8px rgba(30,40,60,.6);position:relative}

.card-photo{width:150px;height:150px;margin:0 auto .8rem;overflow:hidden;border:3px solid rgba(255,255,255,.2);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-name{font-family:'Quicksand',sans-serif;font-size:1.4rem;font-weight:400;color:var(--white);letter-spacing:.5px;margin-top:20px}
.card-title{font-family:'Quicksand',sans-serif;font-size:1rem;color:var(--white);font-weight:300;margin-top:2px}

.card-practice{font-family:'Quicksand',sans-serif;font-size:.82rem;color:rgba(255,255,255,.5);font-weight:300;margin-top:4px}

/* Info rows */
.card-body{padding:1.5rem 0 0}
.info-row{display:flex;align-items:center;gap:14px;padding:16px 2rem;text-decoration:none;color:inherit;transition:background .15s}
.info-row:hover{background:var(--gray-50)}
.info-row:last-child{padding-bottom:2.5rem}
.info-icon{width:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-icon svg{width:18px;height:18px;stroke:var(--blue);stroke-width:1.8;fill:none}
.info-label{font-size:.65rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.8px}
.info-value{font-size:.85rem;font-weight:500;color:var(--blue-darker)}

/* Action buttons */
.card-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--gray-200);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.action-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;text-decoration:none;font-weight:700;font-size:.8rem;transition:all .3s;cursor:pointer;letter-spacing:.3px}
.action-btn svg{width:16px;height:16px;flex-shrink:0;stroke-width:2;fill:none}
.btn-email{background:#3F5580;color:var(--white);border-right:1px solid rgba(255,255,255,.1)}
.btn-email svg{stroke:var(--white)}
.btn-email:hover{background:var(--gold);color:var(--blue-darker)}
.btn-email:hover svg{stroke:var(--blue-darker)}
.btn-phone{background:var(--gold);color:var(--blue-darker)}
.btn-phone svg{stroke:var(--blue-darker)}
.btn-phone:hover{background:#3F5580;color:var(--white)}
.btn-phone:hover svg{stroke:var(--white)}

/* Web link bar */
.card-web{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--gray-50);border-top:1px solid var(--gray-200)}
.card-web a{font-size:.72rem;color:var(--blue);text-decoration:none;font-weight:600}
.card-web a:hover{color:var(--blue-darker)}
.card-web svg{width:14px;height:14px;stroke:var(--blue);stroke-width:1.8;fill:none}

/* Footer */
footer{text-align:center;padding:2rem 1.5rem 3rem;font-size:.72rem;color:var(--gray-400)}
footer a{color:var(--blue);text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .5s ease both}
@media(max-width:480px){
.card-wrapper{margin:1.5rem auto;padding:0 .75rem}
.card-top{padding:3.5rem 1.5rem 1rem}
.info-row{padding:12px 1.5rem}
}
</style>
