<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3D5A98;--blue-dark:#2C4170;--blue-light:#E8EEF7;--gold:#E2C26A;--gold-light:#F8F0DC;--white:#FFF;--gray-50:#F7F8FA;--gray-600:#6B7280}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--gray-50);color:#1F2937;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center}

.app{width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 32px;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--white) 0%,var(--gray-50) 100%)}

.header{text-align:center;z-index:1}
.header h1{font-family:'Quicksand',sans-serif;font-size:20px;font-weight:700;color:var(--blue);letter-spacing:-.3px}
.header p{font-size:13px;color:var(--gray-600);margin-top:2px}
.back-link{position:absolute;top:16px;left:16px;width:36px;height:36px;border:1.5px solid var(--blue-light);border-radius:50%;background:var(--white);color:var(--blue);font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:10;transition:all .2s}
.back-link:hover{background:var(--blue-light)}
.back-link{gap:4px;width:auto;padding:0 12px 0 10px;font-size:13px;font-weight:600}

.timer-area{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.circle-wrap{position:relative;width:280px;height:280px}
svg.ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .track{stroke:var(--blue-light)}
.ring .fill{stroke:var(--blue);transition:stroke-dashoffset .5s ease,stroke .3s;filter:drop-shadow(0 0 6px rgba(61,90,152,.15))}

.timer-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%}
.time-display{font-family:'Quicksand',sans-serif;font-size:52px;font-weight:700;color:var(--blue);letter-spacing:-1px;transition:color .3s}
.time-label{font-size:12px;color:var(--gray-600);margin-top:-4px}

.quadrants{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:260px;z-index:1}
.quad{padding:12px 8px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;color:var(--gray-600);background:var(--white);border:1.5px solid var(--blue-light);transition:all .4s;line-height:1.3}
.quad.active{background:var(--blue);color:var(--white);border-color:var(--blue);box-shadow:0 4px 16px rgba(61,90,152,.25);transform:scale(1.03)}
.quad.done{background:var(--gold-light);color:var(--blue-dark);border-color:var(--gold)}
.quad-icon{font-size:16px;display:block;margin-bottom:2px}

.controls{z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:50px;cursor:pointer;transition:all .25s;letter-spacing:.3px}
.btn-primary{background:var(--blue);color:var(--white);padding:14px 48px;box-shadow:0 4px 16px rgba(61,90,152,.2)}
.btn-primary:hover{background:var(--blue-dark);box-shadow:0 6px 24px rgba(61,90,152,.3)}
.btn-primary:active{transform:scale(.97)}
.btn-small{background:transparent;color:var(--blue);padding:8px 20px;font-size:13px;text-decoration:none;display:inline-block}

[data-state=running] .btn-primary{background:var(--gray-600);opacity:.5;pointer-events:none}
[data-state=done] .controls{display:none}

.win{display:none;flex-direction:column;align-items:center;gap:12px;text-align:center;z-index:1;animation:fadeUp .6s ease both}
[data-state=done] .win{display:flex}
.win h2{font-family:'Quicksand',sans-serif;font-size:22px;color:var(--blue);font-weight:700}
.win p{font-size:14px;color:var(--gray-600)}
.win-stars{font-size:28px;letter-spacing:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.confetti{position:fixed;top:-10px;animation:confettiFall 3s ease-out forwards;pointer-events:none;z-index:100}
@keyframes confettiFall{to{top:110vh;transform:rotate(720deg)}}

.brand{font-size:10px;color:var(--gray-600);opacity:.5;z-index:1;letter-spacing:.5px}

@media(max-width:380px){.circle-wrap{width:240px;height:240px}.time-display{font-size:44px}}
@media(min-height:750px){.timer-area{gap:24px}}



</style>

<script>
// Set texts
document.getElementById('hTitle').textContent=L.title;
document.getElementById('hSub').textContent=L.sub;
document.getElementById('startBtn').textContent=L.start;
document.getElementById('timeLabel').textContent=L.ready;
document.getElementById('winTitle').textContent=L.done;
document.getElementById('winSub').textContent=L.donesub;
document.getElementById('btnAgain').textContent=L.again;
document.getElementById('btnBack').textContent=L.back;

// Set back link
var suffix=LANG==='de'?'':'_'+LANG;
document.getElementById('backLink').href='index'+suffix+'.html';
var backTexts={de:'Portal',pl:'Portal',en:'Portal',tr:'Portal',ar:'البوابة',ru:'Портал',ro:'Portal'};
document.getElementById('backLink').innerHTML='← '+(backTexts[LANG]||'Portal');
document.getElementById('btnBack').href='index'+suffix+'.html';

// Build quadrants
document.getElementById('quads').innerHTML=L.q.map(function(name,i){
  return '<div class="quad" id="q'+i+'"><span class="quad-icon">'+icons[i]+'</span>'+name+'</div>';
}).join('');

// Timer logic
var TOTAL=120,circumference=2*Math.PI*132;
var timeLeft=TOTAL,running=false,timer=null,currentQuad=-1;
var progress=document.getElementById('progress');
var timeDisplay=document.getElementById('timeDisplay');
var timeLabel=document.getElementById('timeLabel');
var app=document.getElementById('app');

progress.style.strokeDasharray=circumference;
progress.style.strokeDashoffset=circumference;

// Audio
var audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playTone(f,d,v){if(audioCtx.state==='suspended')audioCtx.resume();var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v||.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}

function updateDisplay(){
  var m=Math.floor(timeLeft/60),s=timeLeft%60;
  timeDisplay.textContent=m+':'+(s<10?'0':'')+s;
  var pct=(TOTAL-timeLeft)/TOTAL;
  progress.style.strokeDashoffset=circumference*(1-pct);
  // Blue gradation: light → dark as time progresses
  var r=Math.round(100-70*pct),g=Math.round(150-110*pct),b=Math.round(210-90*pct);
  progress.style.stroke='rgb('+r+','+g+','+b+')';

  var newQuad=Math.min(3,Math.floor((TOTAL-timeLeft)/30));
  if(newQuad!==currentQuad&&timeLeft<TOTAL){
    currentQuad=newQuad;
    timeLabel.textContent=L.qb[currentQuad];
    for(var i=0;i<4;i++){
      var el=document.getElementById('q'+i);
      el.classList.remove('active','done');
      if(i<currentQuad)el.classList.add('done');
      else if(i===currentQuad)el.classList.add('active');
    }
    playTone(660,.08);setTimeout(function(){playTone(880,.12)},100);
  }
}

function startTimer(){
  if(running)return;
  running=true;
  app.dataset.state='running';
  document.getElementById('startBtn').textContent=L.running;
  timeLeft=TOTAL;currentQuad=-1;
  updateDisplay();timeLeft--;currentQuad=-1;updateDisplay();

  timer=setInterval(function(){
    timeLeft--;
    if(timeLeft%10===0)playTone(500,.03,.04);
    updateDisplay();
    if(timeLeft<=0){
      clearInterval(timer);running=false;
      for(var i=0;i<4;i++)document.getElementById('q'+i).classList.add('done');
      setTimeout(function(){
        app.dataset.state='done';
        [523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,.25,.1)},i*150)});
        spawnConfetti();
      },500);
    }
  },1000);
}

function resetTimer(){
  timeLeft=TOTAL;running=false;currentQuad=-1;clearInterval(timer);
  app.dataset.state='idle';
  document.getElementById('startBtn').textContent=L.start;
  progress.style.strokeDashoffset=circumference;
  progress.style.stroke='rgb(100,150,210)';
  timeDisplay.textContent='2:00';
  timeLabel.textContent=L.ready;
  for(var i=0;i<4;i++){var el=document.getElementById('q'+i);el.classList.remove('active','done')}
}

function spawnConfetti(){
  var c=['#3D5A98','#E2C26A','#7BA490','#C17B6E','#A88BAE'];
  for(var i=0;i<25;i++){
    var el=document.createElement('div');el.className='confetti';
    el.style.left=Math.random()*100+'%';
    el.style.background=c[Math.floor(Math.random()*c.length)];
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    var s=5+Math.random()*6;el.style.width=s+'px';el.style.height=s+'px';
    el.style.animationDelay=Math.random()*.5+'s';
    document.body.appendChild(el);setTimeout(function(e){e.remove()},3500,el);
  }
}
</script>
